kind = "web"
previewPath = "/"
title = "Drape — Bespoke Fashion Marketplace"
version = "1.0.0"
id = "artifacts/drape"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21822

[services.development]
run = "pnpm --filter @workspace/drape run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/drape", "run", "build" ]
publicDir = "artifacts/drape/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21822"
BASE_PATH = "/"
